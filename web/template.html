<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Explore, search and copy paths from JSON in a fast tree view. Runs entirely in your browser.">
<title>JSON Tree Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2b544'/%3E%3Cpath d='M10 8v16M10 14h8M10 24h8' stroke='%231b1405' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='21' cy='14' r='3' fill='%231b1405'/%3E%3Ccircle cx='21' cy='24' r='3' fill='%231b1405'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f12; --panel: #14171c; --panel-2: #1a1e25; --line: #262b34; --line-2: #323844;
    --text: #e4e6ea; --muted: #8f97a5; --faint: #666e7c; --accent: #f2b544; --accent-ink: #1b1405;
    --ok: #5fd08f; --err: #ff6b6b; --guide: #272c35; --hover: #1c2129; --selected: #2b2819; --mark: #f2b54455;
    --t-key: #8ab4ff; --t-str: #b7e08a; --t-num: #f7a76c; --t-kw: #d49cff; --t-null: #9aa3b2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2ee; --panel: #fffdf9; --panel-2: #f8f6f1; --line: #e3dfd6; --line-2: #d3cec2;
      --text: #1d1f23; --muted: #5f656f; --faint: #8b919b; --accent: #b97c0c; --accent-ink: #fff;
      --ok: #1b8a4f; --err: #cf3333; --guide: #e8e4db; --hover: #f3f0e9; --selected: #fbedcb; --mark: #f2b54477;
      --t-key: #2559c7; --t-str: #3f7d1f; --t-num: #b8520f; --t-kw: #8a3fc4; --t-null: #6c727c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans);
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
  .brand h1 { margin: 0; font: 600 17px/1.2 var(--mono); letter-spacing: -0.02em; }
  .brand h1 b { color: var(--accent); font-weight: 600; }
  .brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 4px 10px;
    border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel);
    color: var(--text); font-size: 12.5px; font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--hover); border-color: var(--faint); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }
  .btn.icon { width: 30px; padding: 0; font-family: var(--mono); }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .tabs { display: none; width: 100%; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
  .tabs button { flex: 1; min-height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

  main {
    flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px 16px;
    grid-template-columns: minmax(280px, 36%) minmax(0, 1fr);
  }
  .pane {
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 6px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
    color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }
  #input {
    flex: 1; width: 100%; min-height: 0; padding: 10px 12px; resize: none; border: 0; outline: 0;
    background: transparent; color: var(--text); font: 13px/20px var(--mono); tab-size: 2; white-space: pre; overflow: auto;
  }

  .tree-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .search { position: relative; flex: 1 1 180px; min-width: 130px; }
  .search input {
    width: 100%; min-height: 30px; padding: 4px 74px 4px 9px; border: 1px solid var(--line-2); border-radius: 7px;
    background: var(--panel); font-size: 13px;
  }
  #match-count { position: absolute; top: 50%; right: 9px; transform: translateY(-50%); color: var(--muted); font: 11.5px var(--mono); pointer-events: none; }
  .tool-group { display: flex; align-items: center; gap: 4px; }
  select.btn { padding-right: 4px; }

  .tree-body { position: relative; flex: 1; min-height: 0; display: flex; }
  #tree { position: relative; flex: 1; min-width: 0; overflow-x: hidden; overflow-y: auto; outline: 0; }
  #tree:focus-visible { box-shadow: inset 0 0 0 1px var(--line-2); }
  #spacer { position: relative; width: 100%; }
  .row {
    position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; height: 26px; padding-right: 10px;
    font: 13px/26px var(--mono); white-space: nowrap; cursor: default; user-select: none;
  }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--selected); box-shadow: inset 2px 0 0 var(--accent); }
  .row.current { box-shadow: inset 2px 0 0 var(--accent), inset 0 0 0 1px var(--accent); }
  .indent {
    flex: none; align-self: stretch; margin-left: 6px;
    background: repeating-linear-gradient(to right, var(--guide) 0 1px, transparent 1px 16px) 8px 0;
  }
  .caret { position: relative; flex: none; width: 18px; height: 26px; cursor: pointer; }
  .caret::before {
    content: ''; position: absolute; top: 9px; left: 5px; width: 6px; height: 6px;
    border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted);
    transform: rotate(-45deg); transition: transform .08s;
  }
  .caret[data-state="open"]::before { top: 8px; transform: rotate(45deg); }
  .caret[data-state="leaf"] { cursor: default; }
  .caret[data-state="leaf"]::before { display: none; }
  .key { flex: 0 1 auto; max-width: 55%; overflow: hidden; text-overflow: ellipsis; color: var(--t-key); }
  .key.index { color: var(--faint); }
  .key.root { color: var(--muted); font-weight: 600; }
  .colon { flex: none; margin-right: 7px; color: var(--faint); }
  .val { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .val.string { color: var(--t-str); }
  .val.number { color: var(--t-num); }
  .val.boolean { color: var(--t-kw); }
  .val.null { color: var(--t-null); font-style: italic; }
  .val.object, .val.array { color: var(--muted); font-size: 12px; }
  .badge {
    flex: none; margin-left: 8px; padding: 0 5px; border: 1px solid var(--err); border-radius: 4px;
    color: var(--err); font-size: 10.5px; line-height: 15px;
  }
  .row.dup .key, .row.dup .val { opacity: .6; text-decoration: line-through; }
  mark { border-radius: 2px; background: var(--mark); color: inherit; }

  .notice {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; background: var(--panel); text-align: center; overflow: auto;
  }
  .notice h2 { margin: 0; font-size: 15px; }
  .notice p { margin: 0; max-width: 46ch; color: var(--muted); overflow-wrap: anywhere; }
  #error h2 { color: var(--err); }
  #error-msg { color: var(--text); font-family: var(--mono); font-size: 13px; }

  #inspector { flex: none; display: flex; flex-direction: column; height: 34%; min-height: 150px; max-height: 300px; border-top: 1px solid var(--line); background: var(--panel-2); }
  .ins-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  #ins-type { flex: none; padding: 2px 7px; border-radius: 5px; background: var(--line); color: var(--muted); font: 11.5px var(--mono); }
  #ins-path {
    flex: 1 1 160px; min-width: 0; overflow: hidden; color: var(--text); font: 12.5px var(--mono);
    text-overflow: ellipsis; white-space: nowrap;
  }
  #ins-value { flex: 1; min-height: 0; margin: 0; padding: 8px 12px; overflow: auto; color: var(--text); font: 12.5px/18px var(--mono); white-space: pre; tab-size: 2; }

  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding: 6px 16px;
    border-top: 1px solid var(--line); color: var(--muted); font: 11.5px var(--mono);
  }
  #st-state.ok { color: var(--ok); }
  #st-state.err { color: var(--err); }
  #st-dups { color: var(--err); }

  #toast {
    position: fixed; left: 50%; bottom: 44px; z-index: 5; padding: 6px 12px; border-radius: 7px;
    background: var(--text); color: var(--bg); font-size: 12.5px; font-weight: 500;
    transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #drop {
    position: fixed; inset: 10px; z-index: 6; display: none; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--bg) 86%, transparent);
    font-size: 17px; font-weight: 600; pointer-events: none;
  }
  body.dropping #drop { display: flex; }

  @media (max-width: 820px) {
    .brand p { display: none; }
    .tabs { display: flex; order: 3; }
    main { grid-template-columns: minmax(0, 1fr); padding: 8px 16px; }
    main[data-view="input"] .tree-pane, main[data-view="tree"] .input-pane { display: none; }
    #inspector { height: 38%; min-height: 130px; }
    footer .privacy { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>json<b>/</b>tree</h1>
    <p>Explore JSON as a fast, searchable tree</p>
  </div>
  <div class="actions">
    <button class="btn" id="btn-sample" type="button">Sample</button>
    <button class="btn" id="btn-open" type="button">Open file</button>
    <input id="file" type="file" accept=".json,.geojson,.txt,application/json" hidden>
    <button class="btn" id="btn-format" type="button">Format</button>
    <button class="btn" id="btn-minify" type="button">Minify</button>
    <button class="btn" id="btn-clear" type="button">Clear</button>
    <a class="btn" href="https://github.com/yasiraza03/json-tree" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>
  <div class="tabs" role="tablist" aria-label="View">
    <button id="tab-input" role="tab" type="button" aria-selected="false">Input</button>
    <button id="tab-tree" role="tab" type="button" aria-selected="true">Tree</button>
  </div>
</header>

<main id="main" data-view="tree">
  <section class="pane input-pane" aria-label="JSON input">
    <div class="pane-head"><span>JSON</span></div>
    <textarea id="input" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JSON input" placeholder="Paste JSON here, or drop a file anywhere"></textarea>
  </section>

  <section class="pane tree-pane" aria-label="JSON tree">
    <div class="tree-tools">
      <div class="search">
        <input id="search" type="search" placeholder="Search keys and values  ( / )" aria-label="Search keys and values" autocomplete="off" spellcheck="false">
        <span id="match-count" aria-live="polite"></span>
      </div>
      <div class="tool-group">
        <button class="btn icon" id="btn-prev" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
        <button class="btn icon" id="btn-next" type="button" aria-label="Next match" title="Next match (Enter)">↓</button>
        <button class="btn icon" id="btn-case" type="button" aria-pressed="false" aria-label="Match case" title="Match case">Aa</button>
      </div>
      <div class="tool-group">
        <button class="btn" id="btn-expand" type="button">Expand all</button>
        <button class="btn" id="btn-collapse" type="button">Collapse</button>
        <select class="btn" id="level" aria-label="Expand to level">
          <option value="">Level</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
      </div>
    </div>

    <div class="tree-body">
      <div id="tree" role="tree" tabindex="0" aria-label="JSON document"><div id="spacer" role="presentation"></div></div>
      <div class="notice" id="empty" hidden>
        <h2>Nothing to show yet</h2>
        <p>Paste JSON, drop a file anywhere, or load the sample.</p>
        <button class="btn primary" id="btn-empty-sample" type="button">Load sample</button>
      </div>
      <div class="notice" id="error" role="alert" hidden>
        <h2>Invalid JSON</h2>
        <p id="error-msg"></p>
        <button class="btn primary" id="btn-jump" type="button">Go to error</button>
      </div>
    </div>

    <div id="inspector" aria-label="Selected node" hidden>
      <div class="ins-bar">
        <span id="ins-type"></span>
        <code id="ins-path"></code>
        <select class="btn" id="path-format" aria-label="Path format">
          <option value="jsonPath">JSONPath</option>
          <option value="pointer">JSON Pointer</option>
          <option value="jqPath">jq</option>
        </select>
        <button class="btn" id="btn-copy-path" type="button">Copy path</button>
        <button class="btn" id="btn-copy-value" type="button">Copy value</button>
        <button class="btn" id="btn-show" type="button">Show in input</button>
      </div>
      <pre id="ins-value" tabindex="0" aria-label="Selected value"></pre>
    </div>
  </section>
</main>

<footer id="status" data-nodes="0">
  <span><span id="st-state"></span> <span id="st-info"></span> <span id="st-dups"></span></span>
  <span class="privacy">Runs in your browser. Nothing is uploaded.</span>
</footer>
<div id="toast" role="status"></div>
<div id="drop">Drop a JSON file to open it</div>

<script>/*__JSONTREE__*/</script>
<script>
(() => {
  'use strict';
  const J = window.JsonTree;
  const $ = (s) => document.querySelector(s);

  const ROW_H = 26;
  const OVERSCAN = 8;
  const STEP = 16;
  const MAX_DOM_HEIGHT = 15e6;       // Browsers cap element height, so very long lists scroll proportionally.
  const MAX_FILE = 64 * 1024 * 1024;
  const STORE_KEY = 'json-tree:input:v1';
  const STORE_LIMIT = 1024 * 1024;
  const MEMO_LIMIT = 5000;
  const VALUE_PREVIEW = 240;

  const SAMPLE = `{
  "order": {
    "id": 12345678901234567890,
    "status": "shipped",
    "total": 149.90,
    "paid": true,
    "coupon": null,
    "placedAt": "2026-03-14T09:26:53Z",
    "customer": {
      "name": "Sam Example",
      "email": "sam@example.com",
      "address": { "city": "Springfield", "postcode": "12345", "country": "US" }
    },
    "items": [
      { "sku": "KB-104", "name": "Mechanical keyboard", "qty": 1, "price": 89.90, "tags": ["desk", "typing"] },
      { "sku": "MS-220", "name": "Wireless mouse", "qty": 2, "price": 30.00, "tags": [] }
    ],
    "shipping": {
      "carrier": "Parcel Post",
      "tracking": [
        { "at": "2026-03-14T15:00:00Z", "event": "Picked up" },
        { "at": "2026-03-16T08:12:00Z", "event": "Delivered" }
      ]
    },
    "notes": "Leave at the door.\\nRing twice.",
    "meta/keys~with symbols": { "a b": 1, "ünï": "çødé ✓" }
  }
}`;

  const el = {
    main: $('#main'), input: $('#input'), tree: $('#tree'), spacer: $('#spacer'),
    empty: $('#empty'), error: $('#error'), errorMsg: $('#error-msg'),
    search: $('#search'), matchCount: $('#match-count'), caseBtn: $('#btn-case'), level: $('#level'),
    inspector: $('#inspector'), insType: $('#ins-type'), insPath: $('#ins-path'), insValue: $('#ins-value'),
    pathFormat: $('#path-format'), status: $('#status'), stState: $('#st-state'), stInfo: $('#st-info'), stDups: $('#st-dups'),
    toast: $('#toast'), file: $('#file'),
  };

  let doc = null;
  let rows = [];
  let expanded = new Set();
  let selected = null;
  let parseError = null;
  let lastMemo = null;
  let matches = [];
  let matchSet = new Set();
  let matchAt = -1;
  let query = '';
  let caseSensitive = false;
  let parseTimer = 0;
  let searchTimer = 0;
  let saveTimer = 0;
  let toastTimer = 0;
  let painting = false;
  const pool = [];

  const storage = {
    get() { try { return localStorage.getItem(STORE_KEY); } catch (_) { return null; } },
    set(text) {
      try {
        if (text.length && text.length <= STORE_LIMIT) localStorage.setItem(STORE_KEY, text);
        else localStorage.removeItem(STORE_KEY);
      } catch (_) { /* Storage is a convenience and may be unavailable. */ }
    },
  };

  const formatBytes = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`);
  const plural = (n, word) => `${n.toLocaleString('en-US')} ${word}${n === 1 ? '' : 's'}`;

  function toast(message) {
    clearTimeout(toastTimer);
    el.toast.textContent = message;
    el.toast.classList.add('show');
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1600);
  }

  function setView(view) {
    el.main.dataset.view = view;
    $('#tab-input').setAttribute('aria-selected', String(view === 'input'));
    $('#tab-tree').setAttribute('aria-selected', String(view === 'tree'));
    requestAnimationFrame(paint);
  }

  /* ---------- virtual list ---------- */

  function metrics() {
    const vh = el.tree.clientHeight;
    const virtual = rows.length * ROW_H;
    const dom = Math.min(virtual, MAX_DOM_HEIGHT);
    return { vh, dom, maxVirtual: Math.max(0, virtual - vh), maxDom: Math.max(0, dom - vh) };
  }

  function virtualTop(m) {
    const top = Math.min(el.tree.scrollTop, m.maxDom);
    return m.maxDom ? (top / m.maxDom) * m.maxVirtual : 0;
  }

  function makeRow() {
    const root = document.createElement('div');
    root.className = 'row';
    root.setAttribute('role', 'treeitem');
    const part = (cls) => {
      const s = document.createElement('span');
      s.className = cls;
      root.appendChild(s);
      return s;
    };
    const row = { root, indent: part('indent'), caret: part('caret'), key: part('key'), colon: part('colon'), val: part('val'), badge: part('badge') };
    row.colon.textContent = ':';
    row.badge.textContent = 'duplicate';
    el.spacer.appendChild(root);
    return row;
  }

  function fillText(target, text, highlight) {
    target.textContent = '';
    if (!highlight || !query) { target.textContent = text; return; }
    const hay = caseSensitive ? text : text.toLowerCase();
    const needle = caseSensitive ? query : query.toLowerCase();
    if (hay.length !== text.length) { target.textContent = text; return; }
    let at = 0;
    for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, at)) {
      if (i > at) target.appendChild(document.createTextNode(text.slice(at, i)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(i, i + needle.length);
      target.appendChild(mark);
      at = i + needle.length;
    }
    if (at < text.length) target.appendChild(document.createTextNode(text.slice(at)));
  }

  function valueLabel(n) {
    if (n.type === 'object') return `{ } ${plural(n.children.length, 'key')}`;
    if (n.type === 'array') return `[ ] ${plural(n.children.length, 'item')}`;
    if (n.type !== 'string') return J.scalarText(n);
    let s = n.value;
    if (s.length > VALUE_PREVIEW) {
      let cut = VALUE_PREVIEW;
      const c = s.charCodeAt(cut - 1);
      if (c >= 0xd800 && c <= 0xdbff) cut--;
      return JSON.stringify(s.slice(0, cut)) + '…';
    }
    return JSON.stringify(s);
  }

  function hasControlChar(s) {
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 32 || c === 127 || c === 0x2028 || c === 0x2029) return true;
    }
    return false;
  }

  function keyLabel(n) {
    if (n.parent === null) return 'root';
    if (typeof n.key === 'number') return String(n.key);
    if (n.key === '' || hasControlChar(n.key)) return JSON.stringify(n.key);
    return n.key;
  }

  function drawRow(row, n) {
    const r = row.root;
    const hasKids = !!(n.children && n.children.length);
    const open = hasKids && expanded.has(n.id);
    const isSelected = n.id === selected;
    const isHit = matchSet.has(n.id);
    const levels = Math.max(2, Math.floor((el.tree.clientWidth * 0.5) / STEP));

    r.id = `row-${n.id}`;
    r.dataset.id = n.id;
    r.setAttribute('aria-level', n.depth + 1);
    r.setAttribute('aria-setsize', n.parent ? n.parent.children.length : 1);
    r.setAttribute('aria-posinset', n.index + 1);
    r.setAttribute('aria-selected', String(isSelected));
    if (hasKids) r.setAttribute('aria-expanded', String(open));
    else r.removeAttribute('aria-expanded');
    r.classList.toggle('selected', isSelected);
    r.classList.toggle('current', matchAt >= 0 && matches[matchAt] === n.id);
    r.classList.toggle('dup', n.overridden);

    row.indent.style.width = `${Math.min(n.depth, levels) * STEP}px`;
    row.caret.dataset.state = hasKids ? (open ? 'open' : 'closed') : 'leaf';
    row.key.className = 'key' + (n.parent === null ? ' root' : typeof n.key === 'number' ? ' index' : '');
    fillText(row.key, keyLabel(n), isHit && typeof n.key === 'string');
    row.val.className = `val ${n.type}`;
    fillText(row.val, valueLabel(n), isHit && !n.children);
    row.badge.hidden = !n.overridden;
  }

  function paint() {
    painting = false;
    const m = metrics();
    el.spacer.style.height = `${m.dom}px`;
    const vTop = virtualTop(m);
    const scrollY = Math.min(el.tree.scrollTop, m.maxDom);
    const first = Math.max(0, Math.floor(vTop / ROW_H) - OVERSCAN);
    const last = Math.min(rows.length, Math.ceil((vTop + m.vh) / ROW_H) + OVERSCAN);
    const count = Math.max(0, last - first);
    while (pool.length < count) pool.push(makeRow());

    let activeRendered = false;
    for (let k = 0; k < count; k++) {
      const pos = first + k;
      const row = pool[k];
      row.root.hidden = false;
      drawRow(row, rows[pos]);
      row.root.style.transform = `translateY(${scrollY - vTop + pos * ROW_H}px)`;
      if (rows[pos].id === selected) activeRendered = true;
    }
    for (let k = count; k < pool.length; k++) {
      pool[k].root.hidden = true;
      pool[k].root.removeAttribute('id');
    }
    if (activeRendered) el.tree.setAttribute('aria-activedescendant', `row-${selected}`);
    else el.tree.removeAttribute('aria-activedescendant');
  }

  function rowIndex(id) {
    let lo = 0;
    let hi = rows.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const v = rows[mid].id;
      if (v === id) return mid;
      if (v < id) lo = mid + 1;
      else hi = mid - 1;
    }
    return -1;
  }

  function scrollToRow(pos, center) {
    if (pos < 0) return;
    const m = metrics();
    el.spacer.style.height = `${m.dom}px`;
    const y = pos * ROW_H;
    const top = virtualTop(m);
    let target;
    if (center && (y < top || y + ROW_H > top + m.vh)) target = y - (m.vh - ROW_H) / 2;
    else if (y < top) target = y;
    else if (y + ROW_H > top + m.vh) target = y + ROW_H - m.vh;
    else return;
    target = Math.max(0, Math.min(target, m.maxVirtual));
    el.tree.scrollTop = m.maxVirtual ? (target / m.maxVirtual) * m.maxDom : 0;
  }

  /* ---------- tree state ---------- */

  function refreshRows() {
    rows = doc ? J.visibleNodes(doc, expanded) : [];
    if (doc && selected !== null) {
      let target = doc.nodes[selected];
      for (let p = target.parent; p; p = p.parent) if (!expanded.has(p.id)) target = p;
      if (target.id !== selected) { selected = target.id; inspect(); }
    }
    paint();
  }

  function setOpen(node, open) {
    if (!node.children || !node.children.length) return;
    if (open) expanded.add(node.id);
    else expanded.delete(node.id);
    refreshRows();
  }

  function select(id, options = {}) {
    selected = id;
    if (options.scroll !== false) scrollToRow(rowIndex(id), options.center);
    paint();
    inspect();
  }

  function reveal(id) {
    for (let p = doc.nodes[id].parent; p; p = p.parent) expanded.add(p.id);
    rows = J.visibleNodes(doc, expanded);
    select(id, { center: true });
  }

  function currentPath(n) {
    const path = J[el.pathFormat.value](n);
    return path === '' ? '""' : path;
  }

  function inspect() {
    const n = doc && selected !== null ? doc.nodes[selected] : null;
    el.inspector.hidden = !n;
    if (!n) return;
    const count = n.children ? ` · ${n.children.length}` : '';
    el.insType.textContent = n.type + count;
    const path = currentPath(n);
    el.insPath.textContent = path.length > 400 ? '…' + path.slice(-399) : path;
    el.insPath.title = path.length > 2000 ? '' : path;
    const shown = J.preview(n, 20000);
    el.insValue.textContent = shown.text + (shown.truncated ? '\n\n… preview shortened. Copy value gets all of it.' : '');
  }

  function remember() {
    if (!doc || expanded.size > MEMO_LIMIT || doc.stats.maxDepth > 200) return null;
    const open = new Set();
    for (const id of expanded) open.add(J.pointer(doc.nodes[id]));
    return { open, selected: selected !== null ? J.pointer(doc.nodes[selected]) : null };
  }

  function restore(memo) {
    expanded = new Set();
    selected = null;
    const stack = [[doc.root, '']];
    while (stack.length) {
      const [node, ptr] = stack.pop();
      if (ptr === memo.selected) selected = node.id;
      if (node.children && node.children.length && memo.open.has(ptr)) {
        expanded.add(node.id);
        for (const child of node.children) stack.push([child, `${ptr}/${J.pointerToken(child.key)}`]);
      }
    }
    if (selected === null) selected = doc.root.id;
  }

  /* ---------- loading ---------- */

  function showNotice(which) {
    el.empty.hidden = which !== 'empty';
    el.error.hidden = which !== 'error';
  }

  function setToolsEnabled(on) {
    for (const id of ['btn-format', 'btn-minify', 'btn-expand', 'btn-collapse']) $(`#${id}`).disabled = !on;
    el.level.disabled = !on;
    el.search.disabled = !on;
    $('#btn-prev').disabled = !on || !matches.length;
    $('#btn-next').disabled = !on || !matches.length;
  }

  function resetSearchState() {
    matches = [];
    matchSet = new Set();
    matchAt = -1;
    el.matchCount.textContent = query ? '0' : '';
  }

  function clearTree() {
    doc = null;
    rows = [];
    expanded = new Set();
    selected = null;
    resetSearchState();
    el.tree.scrollTop = 0;
    paint();
    inspect();
  }

  function load(text, options = {}) {
    clearTimeout(parseTimer);
    const memo = options.fresh ? null : remember() || lastMemo;
    if (options.fresh) lastMemo = null;
    parseError = null;

    if (!text.trim()) {
      lastMemo = null;
      clearTree();
      showNotice('empty');
      el.status.dataset.nodes = '0';
      el.stState.textContent = '';
      el.stState.className = '';
      el.stInfo.textContent = 'No document';
      el.stDups.textContent = '';
      setToolsEnabled(false);
      return;
    }

    const started = performance.now();
    let next;
    try {
      next = J.parse(text);
    } catch (e) {
      lastMemo = memo;
      parseError = e;
      clearTree();
      showNotice('error');
      el.errorMsg.textContent = e.message || 'This document could not be read.';
      $('#btn-jump').hidden = !(e instanceof J.JsonTreeError);
      el.status.dataset.nodes = '0';
      el.stState.textContent = '✕ Invalid JSON';
      el.stState.className = 'err';
      el.stInfo.textContent = e instanceof J.JsonTreeError ? `line ${e.line}, column ${e.column}` : '';
      el.stDups.textContent = '';
      setToolsEnabled(false);
      return;
    }
    const elapsed = performance.now() - started;

    doc = next;
    lastMemo = null;
    showNotice(null);
    if (memo) {
      restore(memo);
    } else {
      expanded = J.expandToDepth(doc, doc.stats.nodes <= 400 ? 3 : 2);
      selected = doc.root.id;
      el.tree.scrollTop = 0;
    }
    rows = J.visibleNodes(doc, expanded);
    runSearch(false);
    paint();
    inspect();

    const s = doc.stats;
    el.status.dataset.nodes = String(s.nodes);
    el.stState.textContent = '✓ Valid';
    el.stState.className = 'ok';
    el.stInfo.textContent = `${plural(s.nodes, 'node')} · depth ${s.maxDepth} · ${formatBytes(new Blob([text]).size)} · ${elapsed < 1 ? '<1' : Math.round(elapsed)} ms`;
    el.stDups.textContent = s.duplicates ? `· ${plural(s.duplicates, 'duplicate key')}` : '';
    setToolsEnabled(true);
  }

  function setInput(text, options = {}) {
    el.input.value = text;
    load(text, { fresh: options.fresh !== false });
    storage.set(text);
  }

  async function openFile(file) {
    if (!file) return;
    if (file.size > MAX_FILE) { toast(`That file is over ${formatBytes(MAX_FILE)}.`); return; }
    try {
      setInput(await file.text());
      setView('tree');
      toast(`Opened ${file.name}`);
    } catch (_) {
      toast('Could not read that file.');
    }
  }

  function rewrite(indent) {
    if (!doc) return;
    const dropped = doc.stats.duplicates;
    const text = J.toJSON(doc.root, indent);
    setInput(text, { fresh: false });
    toast(dropped ? `Done. Removed ${plural(dropped, 'overridden duplicate key')}.` : indent ? 'Formatted' : 'Minified');
  }

  function jumpToInput(start, end) {
    setView('input');
    const input = el.input;
    requestAnimationFrame(() => {
      input.focus();
      input.setSelectionRange(start, end);
      const { line, column } = J.locate(input.value, start);
      input.scrollTop = Math.max(0, (line - 1) * 20 - input.clientHeight / 2);
      input.scrollLeft = Math.max(0, (column - 24) * 7.8);
    });
  }

  /* ---------- search ---------- */

  function updateMatchLabel() {
    el.matchCount.textContent = !query ? '' : matches.length ? `${matchAt + 1}/${matches.length.toLocaleString('en-US')}` : '0';
    $('#btn-prev').disabled = !matches.length;
    $('#btn-next').disabled = !matches.length;
  }

  function runSearch(jump) {
    if (!doc) { resetSearchState(); return; }
    matches = J.search(doc, query, { caseSensitive });
    matchSet = new Set(matches);
    matchAt = matches.length ? 0 : -1;
    if (matches.length && !jump) {
      const at = matches.indexOf(selected);
      if (at >= 0) matchAt = at;
    }
    updateMatchLabel();
    if (jump && matches.length) reveal(matches[0]);
    else paint();
  }

  function step(delta) {
    if (!matches.length) return;
    matchAt = (matchAt + delta + matches.length) % matches.length;
    updateMatchLabel();
    reveal(matches[matchAt]);
  }

  /* ---------- clipboard ---------- */

  async function copy(text, label) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      if (!ok) { toast('Copy was blocked by the browser.'); return; }
    }
    toast(`${label} copied`);
  }

  /* ---------- events ---------- */

  el.input.addEventListener('input', () => {
    clearTimeout(parseTimer);
    clearTimeout(saveTimer);
    const text = el.input.value;
    parseTimer = setTimeout(() => load(el.input.value), Math.min(600, 60 + text.length / 20000));
    saveTimer = setTimeout(() => storage.set(el.input.value), 400);
  });

  el.input.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
    // Plain Tab inserts two spaces. Escape first to move focus out with Tab.
    if (el.input.dataset.tabExit === '1') { el.input.dataset.tabExit = ''; return; }
    e.preventDefault();
    el.input.setRangeText('  ', el.input.selectionStart, el.input.selectionEnd, 'end');
    el.input.dispatchEvent(new Event('input'));
  });
  el.input.addEventListener('keyup', (e) => { if (e.key === 'Escape') el.input.dataset.tabExit = '1'; });
  el.input.addEventListener('blur', () => { el.input.dataset.tabExit = ''; });

  el.tree.addEventListener('scroll', () => {
    if (painting) return;
    painting = true;
    requestAnimationFrame(paint);
  }, { passive: true });

  el.tree.addEventListener('click', (e) => {
    const r = e.target.closest('.row');
    if (!r) return;
    const node = doc.nodes[Number(r.dataset.id)];
    if (e.target.closest('.caret') && node.children && node.children.length) {
      setOpen(node, !expanded.has(node.id));
    }
    select(node.id, { scroll: false });
  });

  el.tree.addEventListener('dblclick', (e) => {
    if (e.target.closest('.caret')) return;
    const r = e.target.closest('.row');
    if (!r) return;
    const node = doc.nodes[Number(r.dataset.id)];
    setOpen(node, !expanded.has(node.id));
  });

  el.tree.addEventListener('keydown', (e) => {
    if (!doc || !rows.length || e.ctrlKey || e.metaKey || e.altKey) return;
    let pos = rowIndex(selected);
    if (pos < 0) pos = 0;
    const n = rows[pos];
    const hasKids = !!(n.children && n.children.length);
    const isOpen = hasKids && expanded.has(n.id);
    const page = Math.max(1, Math.floor(el.tree.clientHeight / ROW_H) - 1);
    let next = null;
    switch (e.key) {
      case 'ArrowDown': next = pos + 1; break;
      case 'ArrowUp': next = pos - 1; break;
      case 'PageDown': next = pos + page; break;
      case 'PageUp': next = pos - page; break;
      case 'Home': next = 0; break;
      case 'End': next = rows.length - 1; break;
      case 'ArrowRight':
        if (hasKids && !isOpen) setOpen(n, true);
        else if (hasKids) next = pos + 1;
        break;
      case 'ArrowLeft':
        if (isOpen) setOpen(n, false);
        else if (n.parent) next = rowIndex(n.parent.id);
        break;
      case 'Enter':
      case ' ':
        if (hasKids) setOpen(n, !isOpen);
        break;
      default:
        return;
    }
    e.preventDefault();
    if (next !== null) select(rows[Math.max(0, Math.min(next, rows.length - 1))].id);
  });

  el.search.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      query = el.search.value;
      runSearch(true);
    }, 120);
  });
  el.search.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (el.search.value !== query) {
        clearTimeout(searchTimer);
        query = el.search.value;
        runSearch(true);
      } else {
        step(e.shiftKey ? -1 : 1);
      }
    } else if (e.key === 'Escape') {
      clearTimeout(searchTimer);
      el.search.value = '';
      query = '';
      runSearch(false);
      el.tree.focus();
    }
  });
  $('#btn-next').addEventListener('click', () => step(1));
  $('#btn-prev').addEventListener('click', () => step(-1));
  el.caseBtn.addEventListener('click', () => {
    caseSensitive = !caseSensitive;
    el.caseBtn.setAttribute('aria-pressed', String(caseSensitive));
    query = el.search.value;
    runSearch(true);
  });

  $('#btn-expand').addEventListener('click', () => { expanded = J.expandToDepth(doc); refreshRows(); });
  $('#btn-collapse').addEventListener('click', () => {
    expanded = doc.root.children && doc.root.children.length ? new Set([doc.root.id]) : new Set();
    el.tree.scrollTop = 0;
    refreshRows();
  });
  el.level.addEventListener('change', () => {
    if (!el.level.value) return;
    expanded = J.expandToDepth(doc, Number(el.level.value));
    el.level.value = '';
    refreshRows();
    scrollToRow(rowIndex(selected), true);
    paint();
  });

  el.pathFormat.addEventListener('change', inspect);
  $('#btn-copy-path').addEventListener('click', () => copy(currentPath(doc.nodes[selected]), 'Path'));
  $('#btn-copy-value').addEventListener('click', () => copy(J.copyText(doc.nodes[selected]), 'Value'));
  $('#btn-show').addEventListener('click', () => {
    const n = doc.nodes[selected];
    jumpToInput(n.start, n.end);
  });
  $('#btn-jump').addEventListener('click', () => {
    if (parseError) jumpToInput(parseError.offset, Math.min(parseError.offset + 1, el.input.value.length));
  });

  $('#btn-sample').addEventListener('click', () => setInput(SAMPLE));
  $('#btn-empty-sample').addEventListener('click', () => setInput(SAMPLE));
  $('#btn-open').addEventListener('click', () => el.file.click());
  el.file.addEventListener('change', () => { openFile(el.file.files[0]); el.file.value = ''; });
  $('#btn-format').addEventListener('click', () => rewrite(2));
  $('#btn-minify').addEventListener('click', () => rewrite(0));
  $('#btn-clear').addEventListener('click', () => { setInput(''); el.input.focus(); setView('input'); });
  $('#tab-input').addEventListener('click', () => setView('input'));
  $('#tab-tree').addEventListener('click', () => setView('tree'));

  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.matches('input, textarea, select')) return;
    if (el.search.disabled) return;
    e.preventDefault();
    setView('tree');
    el.search.focus();
    el.search.select();
  });

  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.add('dropping');
  });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
  window.addEventListener('drop', (e) => {
    document.body.classList.remove('dropping');
    if (!hasFiles(e)) return;
    e.preventDefault();
    openFile(e.dataTransfer.files[0]);
  });

  if ('ResizeObserver' in window) new ResizeObserver(() => paint()).observe(el.tree);
  else window.addEventListener('resize', paint);

  const saved = storage.get();
  setInput(saved !== null ? saved : SAMPLE);
})();
</script>
</body>
</html>
